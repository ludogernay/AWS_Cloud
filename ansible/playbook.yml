---
- name: Deploy app on EC2
  hosts: all
  become: true

  vars:
    github_actor: "{{ lookup('env', 'GITHUB_ACTOR') }}"
    github_token: "{{ lookup('env', 'GITHUB_TOKEN') }}"

  tasks:
    # ---- Installation Docker ----
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Add Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
        gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
        https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | \
        tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: yes
        state: present

    - name: Start Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    # ---- Déploiement de l'app ----
    - name: Créer le dossier app
      file:
        path: /home/ubuntu/app/nginx
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Copier docker-compose.yml
      copy:
        src: ../docker-compose.yml
        dest: /home/ubuntu/app/docker-compose.yml
        owner: ubuntu
        group: ubuntu

    - name: Copier nginx.conf
      copy:
        src: ../nginx/nginx.conf
        dest: /home/ubuntu/app/nginx/nginx.conf
        owner: ubuntu
        group: ubuntu

    - name: Login GHCR
      shell: |
        echo "{{ github_token }}" | docker login ghcr.io -u {{ github_actor }} --password-stdin
      become_user: ubuntu

    - name: Pull et démarrer les containers
      shell: docker compose up -d --pull always
      args:
        chdir: /home/ubuntu/app
      become_user: ubuntu