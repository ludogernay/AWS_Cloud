global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Métriques système de l'instance EC2 (CPU, RAM, disque)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  # Métriques internes de Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']